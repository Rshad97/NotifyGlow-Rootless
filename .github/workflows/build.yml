name: Build NotifyGlow
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notifyglow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test render policy
        run: |
          cc -std=c11 -Wall -Wextra -Werror tests/logic.c -o /tmp/ng-logic
          /tmp/ng-logic
          python3 scripts/validate.py
      - name: Install build tools
        run: brew install ldid dpkg
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz -o /tmp/sdk.tar.xz
          tar -xf /tmp/sdk.tar.xz -C "$HOME/theos/sdks"
      - name: Compile and package
        run: make clean package FINALPACKAGE=1
      - name: Verify package
        run: |
          python3 scripts/validate.py --package
          shasum -a 256 packages/*.deb > packages/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: NotifyGlow-Rootless-1.0.0
          path: |
            packages/*.deb
            packages/SHA256SUMS
          if-no-files-found: error
